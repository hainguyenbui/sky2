<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
<th:block th:fragment="styles">
    <style>
        .chat-notify {
            position: fixed;
            bottom: 24px;
            right: 20px;
            background: rgba(15,23,42,0.92);
            border: 1px solid rgba(96,165,250,0.45);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.84rem;
            font-weight: 700;
            color: #93c5fd;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .chat-notify.show {
            opacity: 1;
            transform: translateY(0);
        }
        .chat-section { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
        .chat-box { border-radius: 14px; border: 1px solid var(--card-border); background: rgba(15,23,42,0.55); overflow: hidden; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; user-select: none; }
        .chat-title { font-weight: 800; font-size: 0.92rem; }
        .chat-toggle { font-size: 1.1rem; color: var(--text-muted); }
        .chat-messages { height: 148px; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; border-top: 1px solid var(--card-border); }
        .chat-msg { font-size: 0.82rem; color: var(--text-primary); line-height: 1.45; word-break: break-word; }
        .chat-preview { padding: 6px 14px; font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid var(--card-border); }
        .chat-input-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--card-border); }
        .chat-input { flex: 1; background: rgba(30,41,59,0.6); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 10px; color: var(--text-primary); font-size: 0.84rem; outline: none; }
        .chat-input:focus { border-color: rgba(96,165,250,0.6); }
        .chat-send-btn { padding: 8px 14px; border-radius: 8px; border: none; background: rgba(59,130,246,0.75); color: #fff; font-weight: 700; cursor: pointer; font-size: 0.84rem; }
        .chat-send-btn:hover { background: rgba(59,130,246,1); }
        .chat-input:disabled { opacity: 0.6; cursor: not-allowed; }
        .chat-send-btn:disabled { opacity: 0.55; cursor: not-allowed; background: rgba(100,116,139,0.55); }
        #chatSection.inline-chat { margin-top: 10px; }
        #chatSection.panel-chat { margin-top: 0; }
    </style>
</th:block>

<th:block th:fragment="html">
    <div id="chatInlineHost">
        <div id="chatSection" class="chat-section inline-chat"></div>
    </div>

    <div id="chatPanel" class="feature-panel">
        <div class="section-title">
            <h3>Chat</h3>
            <small>Trò chuyện trong ván</small>
        </div>
        <div id="chatPanelHost"></div>
    </div>

    <div id="chatNotify" class="chat-notify">💬 Có tin nhắn mới!</div>
</th:block>

<th:block th:fragment="script">
    <script>
        (function() {
            if (window.__chatFragmentLoaded) {
                return;
            }
            window.__chatFragmentLoaded = true;
            window.__chatState = window.__chatState || {};
            window.__chatSubscribed = window.__chatSubscribed || {};
            let chatInitialized = false;
            let hasUnreadChat = false;
            let chatNotifyTimer = null;

            function readCurrentIsDead() {
                if (typeof currentIsDead !== 'undefined') {
                    return !!currentIsDead;
                }
                return !!(window.__msAutoCtx && window.__msAutoCtx.currentIsDead);
            }

            function readCurrentMemberName() {
                const ctxMemberBox = window.__msAutoCtx && window.__msAutoCtx.memberBox;
                return ctxMemberBox ? (ctxMemberBox.dataset.memberName || 'Ẩn danh') : 'Ẩn danh';
            }

            window.setChatUnreadIndicator = function(active) {
                hasUnreadChat = !!active;
                const chatBtn = document.getElementById('dockChatBtn');
                if (!chatBtn) {
                    return;
                }
                chatBtn.classList.toggle('has-unread', hasUnreadChat);
            };

            window.isChatPanelOpen = function() {
                const panel = document.getElementById('chatPanel');
                return !!(panel && panel.classList.contains('open'));
            };

            window.ChatComponent = window.ChatComponent || {
                applyMode: function(isOn) {
                    const section = document.getElementById('chatSection');
                    const inlineHost = document.getElementById('chatInlineHost');
                    const panelHost = document.getElementById('chatPanelHost');
                    const panel = document.getElementById('chatPanel');
                    if (!section || !inlineHost || !panelHost || !panel) {
                        return;
                    }
                    if (isOn) {
                        if (section.parentNode !== panelHost) {
                            panelHost.appendChild(section);
                        }
                        section.classList.remove('inline-chat');
                        section.classList.add('panel-chat');
                        inlineHost.classList.add('inline-hidden');
                        return;
                    }
                    if (section.parentNode !== inlineHost) {
                        inlineHost.appendChild(section);
                    }
                    section.classList.remove('panel-chat');
                    section.classList.add('inline-chat');
                    inlineHost.classList.remove('inline-hidden');
                    panel.classList.remove('open');
                    document.getElementById('dockChatBtn').classList.remove('active');
                }
            };

            function buildChatBoxHtml(key) {
                const s = window.__chatState[key];
                if (!s) return '';
                const expanded = s.expanded;
                const disabledInputAttr = readCurrentIsDead() ? ' disabled' : '';
                const inputPlaceholder = readCurrentIsDead() ? 'Bạn đã bị loại nên không thể chat' : 'Nhập tin nhắn...';
                const headerStyle = 'border-bottom: 2px solid ' + s.color + ';';
                const titleStyle = 'color:' + s.color + ';';
                const messagesHtml = expanded
                    ? '<div class="chat-messages" id="chatMsgs-' + key + '">' +
                      s.messages.map(function(m) { return '<div class="chat-msg">' + escapeHtml(m) + '</div>'; }).join('') +
                      '</div>' +
                      '<div class="chat-input-row">' +
                      '<input class="chat-input" id="chatInput-' + key + '" type="text" placeholder="' + escapeAttr(inputPlaceholder) + '" maxlength="200"' + disabledInputAttr + '>' +
                      '<button class="chat-send-btn" data-chat-send="' + key + '"' + disabledInputAttr + '>→</button>' +
                      '</div>'
                    : '<div class="chat-preview">' + escapeHtml(s.lastMessage || 'Chưa có tin nhắn') + '</div>';
                return '<div class="chat-box" id="chatBox-' + key + '">' +
                    '<div class="chat-header" data-chat-toggle="' + key + '" style="' + headerStyle + '">' +
                        '<span class="chat-title" style="' + titleStyle + '">' + escapeHtml(s.title) + '</span>' +
                        '<span class="chat-toggle">' + (expanded ? '−' : '+') + '</span>' +
                    '</div>' +
                    messagesHtml +
                '</div>';
            }

            function rerenderChatBox(key) {
                const box = document.getElementById('chatBox-' + key);
                if (!box) return;
                const parent = box.parentNode;
                const newBox = document.createElement('div');
                newBox.innerHTML = buildChatBoxHtml(key);
                parent.replaceChild(newBox.firstChild, box);
                if (window.__chatState[key].expanded) {
                    const msgs = document.getElementById('chatMsgs-' + key);
                    if (msgs) msgs.scrollTop = msgs.scrollHeight;
                }
            }

            window.syncChatComposerState = function() {
                const disabled = readCurrentIsDead();
                const placeholder = disabled ? 'Bạn đã bị loại nên không thể chat' : 'Nhập tin nhắn...';
                document.querySelectorAll('.chat-input').forEach(function(input) {
                    input.disabled = disabled;
                    input.placeholder = placeholder;
                });
                document.querySelectorAll('.chat-send-btn').forEach(function(button) {
                    button.disabled = disabled;
                });
            };

            window.initChats = function() {
                if (chatInitialized) return;
                const section = document.getElementById('chatSection');
                if (!section) return;
                section.innerHTML = '';
                fetch('/msAutoV1/chat/list')
                    .then(handleJsonResponse)
                    .then(function(list) {
                        if (!list || !list.length) return;
                        list.forEach(function(chat) {
                            const key = chat.key;
                            window.__chatState[key] = {
                                title: chat.title,
                                color: chat.color,
                                messages: chat.messages || [],
                                lastMessage: chat.lastMessage || '',
                                expanded: true
                            };
                            const wrapper = document.createElement('div');
                            wrapper.innerHTML = buildChatBoxHtml(key);
                            section.appendChild(wrapper.firstChild);
                            const msgs = document.getElementById('chatMsgs-' + key);
                            if (msgs) msgs.scrollTop = msgs.scrollHeight;
                            window.subscribeChatTopic(key);
                        });
                        chatInitialized = true;
                    })
                    .catch(function(err) { console.warn('Chat init error', err); });
            };

            window.subscribeChatTopic = function(key) {
                if (window.__chatSubscribed[key]) return;
                window.__chatSubscribed[key] = true;
                sendStomp('SUBSCRIBE\nid:sub-chat-' + key + '\ndestination:/topic/chat/' + key + '\n\n');
            };

            window.reconnectChatSubscriptions = function() {
                Object.keys(window.__chatSubscribed).forEach(function(key) {
                    window.__chatSubscribed[key] = false;
                    window.subscribeChatTopic(key);
                });
            };

            window.hasChatKey = function(key) {
                return !!window.__chatState[key];
            };

            function showChatNotify() {
                const el = document.getElementById('chatNotify');
                if (!el) return;
                if (chatNotifyTimer) {
                    clearTimeout(chatNotifyTimer);
                } else {
                    el.classList.add('show');
                }
                chatNotifyTimer = setTimeout(function() {
                    el.classList.remove('show');
                    chatNotifyTimer = null;
                }, 3000);
            }

            window.handleChatMessage = function(payload) {
                const key = payload.key;
                if (!key || !window.__chatState[key]) return;
                const msg = payload.message || '';
                if (!msg) return;
                window.__chatState[key].messages.push(msg);
                window.__chatState[key].lastMessage = msg;
                rerenderChatBox(key);
                if (window.SettingComponent && window.SettingComponent.state.chatOn && !window.isChatPanelOpen()) {
                    window.setChatUnreadIndicator(true);
                }
                showChatNotify();
            };

            function sendChatMessage(key) {
                if (readCurrentIsDead()) return;
                const input = document.getElementById('chatInput-' + key);
                if (!input || input.disabled) return;
                const text = input.value.trim();
                if (!text) return;
                input.value = '';
                fetch('/msAutoV1/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key, senderName: readCurrentMemberName(), message: text })
                }).catch(function(err) { console.warn('Chat send error', err); });
            }

            document.addEventListener('click', function(event) {
                const toggleEl = event.target.closest('[data-chat-toggle]');
                if (toggleEl) {
                    const key = toggleEl.dataset.chatToggle;
                    if (window.__chatState[key]) {
                        window.__chatState[key].expanded = !window.__chatState[key].expanded;
                        rerenderChatBox(key);
                    }
                    return;
                }
                const sendEl = event.target.closest('[data-chat-send]');
                if (sendEl) {
                    sendChatMessage(sendEl.dataset.chatSend);
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key !== 'Enter') return;
                const input = event.target;
                if (!input.classList.contains('chat-input')) return;
                const key = input.id.replace('chatInput-', '');
                sendChatMessage(key);
            });
        })();
    </script>
</th:block>
</body>
</html>

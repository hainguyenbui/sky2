<div id="orderModal" class="modal-mask">
    <div class="modal-card" style="max-width: 520px;">
        <h3 style="margin-bottom: 10px;">Sắp xếp người chơi</h3>
        <p class="desc" style="margin-bottom: 12px;">Kéo thả để đổi thứ tự hiển thị bảng ngày và bảng đêm.</p>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
            <button type="button" id="orderSortAscBtn" class="btn btn-primary" style="flex:1;">Tên A → Z</button>
            <button type="button" id="orderSortDescBtn" class="btn btn-danger" style="flex:1;">Tên Z → A</button>
        </div>
        <div id="orderPlayerList" class="order-list"></div>
        <div class="modal-actions">
            <button type="button" id="orderCloseBtn" class="btn btn-danger">Đóng</button>
            <button type="button" id="orderSaveBtn" class="btn btn-primary">Lưu thứ tự</button>
        </div>
    </div>
</div>

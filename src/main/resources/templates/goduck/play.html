<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('GoDuck')}"></th:block>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>GoDuck</h1>
        <p class="desc">Giữ kín thông tin bạn nhận được</p>
    </div>

    <div class="card">
        <p class="reveal-label">THÔNG TIN MẬT CỦA BẠN</p>
        <div class="reveal-box blurred" data-reveal>
                <span class="reveal-hide-hint">Chạm để ẩn</span>
            <div class="reveal-placeholder">👁️ Chạm để xem</div>
            <div class="reveal-content">
                <h2 th:text="${#strings.isEmpty(secretInfo)} ? 'Chưa có thông tin' : ${secretInfo}"></h2>
            </div>
        </div>
    </div>

    <div th:if="${totalPlay == 0}" class="notice">Đang chờ quản trò khởi chạy ván đấu...</div>

    <div th:unless="${totalPlay == 0}" class="card">
        <div class="row-between">
            <span class="badge badge-village">Tổng: <span th:text="${totalPlay}"></span></span>
            <span class="badge badge-wolf">Số Spy: <span th:text="${spyTotalPlay}"></span></span>
        </div>
    </div>

    <div class="card">
        <p class="card-label">Người chơi trong phòng</p>
        <div class="grid-2">
            <div th:each="player : ${members}" class="grid-cell"
                 th:text="${player.id + '. ' + player.userName}"></div>
        </div>
    </div>

    <div class="card qr-sm">
        <p class="card-label">Mời thêm bạn bè bằng mã QR</p>
        <div class="qr-container">
            <img th:src="${image}" alt="Mã QR để tham gia phòng GoDuck" class="qr-image">
        </div>
    </div>
</div>
</body>
</html>

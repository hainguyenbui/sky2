<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('GoDuck - Thiết lập')}"></th:block>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>Thiết lập GoDuck</h1>
        <p class="desc" th:if="${setup != null and setup > 0}" th:text="'Đã khởi tạo ván chơi ' + ${setup}"></p>
        <p class="desc" th:unless="${setup != null and setup > 0}">Chọn số người rồi khởi tạo ván mới</p>
    </div>

    <div class="card">
        <p class="card-label">Cấu hình ván đấu</p>
        <div class="item-list">
            <div class="item-row">
                <label class="text-sm" for="total">Tổng người chơi</label>
                <input type="number" min="0" id="total" name="total" class="input-text input-num"
                       th:value="${totalPlayers != null ? totalPlayers : 4}">
            </div>
            <div class="item-row">
                <label class="text-sm" for="spy">Số lượng Spy</label>
                <input type="number" min="0" id="spy" name="spy" class="input-text input-num"
                       th:value="${numSpies != null ? numSpies : 1}">
            </div>
        </div>
        <div class="card-actions">
            <button type="button" id="sendButton" class="btn btn-primary">Khởi tạo ván mới</button>
            <a href="/gd/play" target="_blank" class="btn btn-secondary">Mở phòng chơi</a>
            <button type="button" id="clearData" class="btn btn-danger">Xoá toàn bộ dữ liệu</button>
        </div>
    </div>

    <div class="card qr-sm">
        <p class="card-label">Mã QR để người chơi tham gia</p>
        <div class="qr-container">
            <img th:src="${image}" alt="Mã QR để tham gia phòng GoDuck" class="qr-image">
        </div>
    </div>
</div>

<script>
    const CONFIG_KEY = 'goduck.setup.v1';
    const FIELDS = ['total', 'spy'];

    function saveConfig() {
        const state = {};
        FIELDS.forEach(id => state[id] = document.getElementById(id).value);
        sessionStorage.setItem(CONFIG_KEY, JSON.stringify(state));
    }

    function restoreConfig() {
        const raw = sessionStorage.getItem(CONFIG_KEY);
        if (!raw) return;
        try {
            const state = JSON.parse(raw);
            FIELDS.forEach(id => {
                if (state[id] !== undefined) document.getElementById(id).value = state[id];
            });
        } catch (error) {
            console.error('Không khôi phục được cấu hình:', error);
        }
    }

    FIELDS.forEach(id => document.getElementById(id).addEventListener('change', saveConfig));
    restoreConfig();

    document.getElementById('sendButton').onclick = function () {
        saveConfig();
        const path = ['/gd/setup', ...FIELDS.map(id => document.getElementById(id).value)].join('/');
        fetch(path)
            .then(() => {
                UI.flash({message: 'Đã khởi tạo ván mới.', tone: 'success'});
                UI.go('/gd/setup');
            })
            .catch(() => UI.toast('Không khởi tạo được ván. Vui lòng thử lại.', 'danger'));
    };

    document.getElementById('clearData').onclick = async function () {
        const confirmed = await UI.confirm({
            title: 'Xoá toàn bộ dữ liệu GoDuck?',
            message: 'Danh sách người chơi và vai trò của ván hiện tại sẽ mất hết.',
            confirmLabel: 'Xoá hết',
            tone: 'danger'
        });
        if (!confirmed) return;

        fetch('/gd/clear')
            .then(response => response.text())
            .then(message => {
                UI.flash({message: message, tone: 'success'});
                UI.reload();
            })
            .catch(() => UI.toast('Không xoá được dữ liệu. Vui lòng thử lại.', 'danger'));
    };
</script>
</body>
</html>

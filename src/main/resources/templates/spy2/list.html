<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Undercover - Quản lý người chơi')}"></th:block>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>Quản lý người chơi</h1>
        <p class="desc">Theo dõi và loại người chơi khỏi ván Undercover</p>
    </div>

    <div class="card">
        <p class="card-label">Danh sách phòng chơi</p>
        <div class="item-list">
            <div th:each="player : ${players}" class="item-row">
                <span class="text-sm" th:classappend="${player.remove} ? 'muted' : ''"
                      th:text="${player.id + '. ' + player.userName}"></span>
                <span th:if="${player.remove}" class="badge badge-danger">Đã loại</span>
                <span th:unless="${player.remove}" class="badge badge-village">Đang sống</span>
            </div>
        </div>
    </div>

    <div th:if="${not #lists.isEmpty(removed)}" class="card">
        <p class="card-label">Danh tính người đã bị loại</p>
        <div class="item-list">
            <div th:each="player : ${removed}" class="item-row">
                <span class="text-sm muted" th:text="${#strings.toUpperCase(player.userName)}"></span>
                <span class="badge"
                      th:classappend="${player.role == 'Spy'} ? 'badge-wolf' : (${player.role == 'Mũ Trắng'} ? 'badge-neutral' : 'badge-village')"
                      th:text="${player.role}"></span>
            </div>
        </div>
    </div>

    <div class="card">
        <p class="card-label">Loại người chơi theo ID</p>
        <div class="row-between">
            <input type="number" id="numberInput" class="input-text" placeholder="Nhập ID" min="1">
            <button id="okButton" class="btn btn-danger btn-auto">Loại</button>
        </div>
        <div class="card-actions">
            <a href="/spy2/setup" class="btn btn-quiet">Về trang thiết lập</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('okButton').addEventListener('click', async function () {
        const id = document.getElementById('numberInput').value;
        if (!id) { UI.toast('Vui lòng nhập ID người chơi.'); return; }
        const confirmed = await UI.confirm({
            title: 'Loại người chơi #' + id + '?',
            message: 'Vai trò của người này sẽ được công khai cho cả phòng.',
            confirmLabel: 'Loại khỏi ván',
            tone: 'danger'
        });
        if (!confirmed) return;

        fetch('/spy2/remove/' + encodeURIComponent(id))
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.text();
            })
            .then(role => {
                UI.flash({title: 'Đã loại người chơi #' + id, message: 'Vai trò: ' + role});
                UI.reload();
            })
            .catch(error => UI.toast('Không loại được người chơi: ' + error.message, 'danger'));
    });
</script>
</body>
</html>

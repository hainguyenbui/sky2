<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Ma Sói - Thiết lập ván')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/masoi-run.css}">
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>Thiết lập ván</h1>
        <p class="desc">Chọn tổng số người chơi và các vai trò có trong ván</p>
    </div>

    <form id="dataForm" class="stack">
        <div class="setup-summary">
            <div class="row-between">
                <label class="field-label" for="total">Tổng người chơi</label>
                <input type="number" min="0" id="total" name="total" value="0" class="input-text input-num">
            </div>
            <hr class="divider">
            <div class="row-between">
                <span class="field-label">Vai trò đã chọn</span>
                <div class="setup-count">
                    <span id="sum" class="setup-count-value">0</span>
                </div>
            </div>
            <p id="sumHint" class="desc setup-hint"></p>
        </div>

        <div class="card">
            <p class="card-label">Phe Sói</p>
            <div class="item-list">
                <th:block th:each="item : ${datas}">
                    <div th:if="${#lists.contains(idSoi, item.id)}" class="role-row role-row-wolf">
                        <div class="role-row-info">
                            <span class="role-row-name">
                                <span class="dot dot-wolf"></span>
                                <span th:text="${#strings.toUpperCase(item.role)}"></span>
                            </span>
                            <span class="role-row-desc" th:text="${item.description}"></span>
                        </div>
                        <input th:if="${item.id == 1 or item.id == 30}" type="number" min="0" value="0"
                               th:id="${item.id}" th:name="${item.id}" class="input-text input-num"
                               oninput="updateSum()">
                        <label th:unless="${item.id == 1 or item.id == 30}" class="switch">
                            <input type="checkbox" th:id="${item.id}" th:name="${item.id}" value="1"
                                   onclick="updateSum()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </th:block>
            </div>
        </div>

        <div class="card">
            <p class="card-label">Phe khác</p>
            <div class="item-list">
                <th:block th:each="item : ${datas}">
                    <div th:if="${#lists.contains(idOutsider, item.id)}" class="role-row role-row-neutral">
                        <div class="role-row-info">
                            <span class="role-row-name">
                                <span class="dot dot-neutral"></span>
                                <span th:text="${#strings.toUpperCase(item.role)}"></span>
                            </span>
                            <span class="role-row-desc" th:text="${item.description}"></span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" th:id="${item.id}" th:name="${item.id}" value="1"
                                   onclick="updateSum()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </th:block>
            </div>
        </div>

        <div class="card">
            <p class="card-label">Phe Dân</p>
            <div class="item-list">
                <th:block th:each="item : ${datas}">
                    <div th:if="${not #lists.contains(idSoi, item.id) and not #lists.contains(idOutsider, item.id)}"
                         class="role-row role-row-village">
                        <div class="role-row-info">
                            <span class="role-row-name">
                                <span class="dot dot-village"></span>
                                <span th:text="${#strings.toUpperCase(item.role)}"></span>
                            </span>
                            <span class="role-row-desc" th:text="${item.description}"></span>
                        </div>
                        <input th:if="${item.id == 1 or item.id == 30}" type="number" min="0" value="0"
                               th:id="${item.id}" th:name="${item.id}" class="input-text input-num"
                               oninput="updateSum()">
                        <label th:unless="${item.id == 1 or item.id == 30}" class="switch">
                            <input type="checkbox" th:id="${item.id}" th:name="${item.id}" value="1"
                                   onclick="updateSum()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </th:block>
            </div>
        </div>

        <div class="card">
            <p class="card-label">Cấu hình nâng cao</p>
            <div class="role-row">
                <div class="role-row-info">
                    <span class="role-row-name">CUPID (TÌNH YÊU)</span>
                    <span class="role-row-desc">Ghép đôi ngẫu nhiên 2 người chơi</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="checkCupid" name="checkCupid" value="1">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="setup-actions">
            <button type="button" id="sendButton" class="btn btn-primary">Khởi chạy ván đấu</button>
        </div>
    </form>
</div>

<script>
    const SETUP_KEY = 'masoi.setup.v1';

    function setupFields() {
        return document.querySelectorAll('#dataForm input[name]');
    }

    function saveSetupState() {
        const state = {};
        setupFields().forEach(field => {
            state[field.name] = field.type === 'checkbox' ? field.checked : field.value;
        });
        sessionStorage.setItem(SETUP_KEY, JSON.stringify(state));
    }

    function restoreSetupState() {
        const raw = sessionStorage.getItem(SETUP_KEY);
        if (!raw) return;
        try {
            const state = JSON.parse(raw);
            Object.keys(state).forEach(name => {
                const field = document.querySelector('#dataForm input[name="' + name + '"]');
                if (!field) return;
                if (field.type === 'checkbox') field.checked = state[name] === true;
                else field.value = state[name];
            });
        } catch (error) {
            console.error('Không khôi phục được thiết lập:', error);
        }
    }

    function updateSum() {
        let sum = 0;
        document.querySelectorAll('#dataForm input[type="number"]:not(#total)')
            .forEach(input => sum += parseInt(input.value, 10) || 0);
        document.querySelectorAll('#dataForm input[type="checkbox"]:not(#checkCupid):checked')
            .forEach(box => sum += parseInt(box.value, 10) || 0);

        const total = parseInt(document.getElementById('total').value, 10) || 0;
        const sumEl = document.getElementById('sum');
        const hintEl = document.getElementById('sumHint');

        sumEl.textContent = sum;
        sumEl.classList.toggle('is-over', total > 0 && sum > total);

        if (total === 0) hintEl.textContent = 'Nhập tổng số người chơi để đối chiếu.';
        else if (sum === total) hintEl.textContent = 'Khớp với tổng số người chơi.';
        else if (sum < total) hintEl.textContent = 'Còn thiếu ' + (total - sum) + ' vai trò.';
        else hintEl.textContent = 'Thừa ' + (sum - total) + ' vai trò so với tổng người chơi.';

        saveSetupState();
    }

    setupFields().forEach(field => {
        field.addEventListener('change', updateSum);
        field.addEventListener('input', updateSum);
    });
    restoreSetupState();
    updateSum();

    document.getElementById('sendButton').onclick = function () {
        saveSetupState();
        const params = new URLSearchParams();
        document.querySelectorAll('#dataForm input[type="number"]')
            .forEach(input => params.append(input.name, input.value));
        document.querySelectorAll('#dataForm input[type="checkbox"]:checked')
            .forEach(box => { if (box.id !== 'checkCupid') params.append(box.name, 1); });
        params.append('checkCupid', document.getElementById('checkCupid').checked ? 'true' : 'false');

        fetch('/ms/create?' + params.toString())
            .then(response => response.text())
            .then(async data => {
                if (data.includes('ERROR')) {
                    await UI.notify({title: 'Chưa khởi chạy được ván', message: data, tone: 'danger'});
                    return;
                }
                if (data.includes('ALERT')) {
                    await UI.notify({title: 'Lưu ý', message: data});
                }
                UI.flash({message: 'Đã chia vai trò. Người chơi có thể vào phòng.', tone: 'success'});
                UI.go('/ms/admin');
            })
            .catch(() => UI.toast('Không khởi chạy được ván. Vui lòng thử lại.', 'danger'));
    };
</script>
</body>
</html>

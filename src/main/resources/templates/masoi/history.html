<!--
  Mảnh HTML được nạp vào hộp thoại lịch sử ở /ms/play qua innerHTML.
  Không phải một trang độc lập: kiểu dáng lấy từ /css/masoi-history.css do trang cha nạp sẵn.
-->
<div xmlns:th="http://www.thymeleaf.org">
    <div th:if="${#lists.isEmpty(games)}" class="empty-state">Chưa có ván đấu nào được lưu</div>

    <div th:each="game : ${games}" class="game-card">
        <div class="game-number" th:text="'Ván ' + ${game.gameNumber}"></div>

        <div th:each="round : ${game.details}" class="game-round">
            <strong th:text="${round.label}"></strong>
            <div th:each="event : ${round.events}" th:text="${'- ' + event}"></div>
        </div>

        <div th:each="player : ${game.players}" class="player-row">
            <span class="player-name">
                <span class="dot"
                      th:classappend="${player.isSoi} ? 'dot-wolf' : (${player.isOutsider} ? 'dot-neutral' : 'dot-village')"></span>
                <span th:text="${player.displayName}"></span>
            </span>
            <span class="player-role"
                  th:classappend="${player.isSoi} ? 'role-soi' : (${player.isOutsider} ? 'role-outsider' : 'role-dan')"
                  th:text="${player.displayLocation}"></span>
        </div>
    </div>
</div>

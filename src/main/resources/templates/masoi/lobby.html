<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Ma Sói')}"></th:block>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>Ma Sói</h1>
        <p class="desc">Nhập tên để nhận vai trò của bạn</p>
    </div>

    <div class="card">
        <form class="stack" onsubmit="joinGame(event)">
            <div class="field">
                <label class="field-label" for="nameId">Tên của bạn</label>
                <input type="text" id="nameId" class="input-text" placeholder="Ví dụ: Huy, Nam..."
                       autocomplete="nickname" maxlength="20" required>
            </div>
            <button type="submit" class="btn btn-primary">Vào chơi</button>
        </form>
    </div>

    <div class="card qr-sm">
        <p class="card-label">Mời thêm bạn bè bằng mã QR</p>
        <div class="qr-container">
            <img th:src="${image}" alt="Mã QR để tham gia phòng Ma Sói" class="qr-image">
        </div>
    </div>
</div>

<script>
    function joinGame(event) {
        event.preventDefault();
        const name = document.getElementById('nameId').value.trim();
        if (name) window.location.href = '/ms/play/' + encodeURIComponent(name);
    }
</script>
</body>
</html>

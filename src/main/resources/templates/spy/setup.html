<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Spyfall - Thiết lập')}"></th:block>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>Thiết lập Spyfall</h1>
        <p class="desc" th:if="${setup}" th:text="'Đã khởi tạo ván chơi ' + ${number}"></p>
        <p class="desc" th:unless="${setup}">Chọn số người rồi khởi tạo ván mới</p>
    </div>

    <div class="card">
        <p class="card-label">Cấu hình ván đấu</p>
        <div class="item-list">
            <div class="item-row">
                <label class="text-sm" for="total">Tổng người chơi</label>
                <input type="number" min="0" id="total" name="total" class="input-text input-num"
                       th:value="${totalPlayers != null ? totalPlayers : 4}">
            </div>
            <div class="item-row">
                <label class="text-sm" for="spy">Số lượng Spy</label>
                <input type="number" min="0" id="spy" name="spy" class="input-text input-num"
                       th:value="${numSpies != null ? numSpies : 1}">
            </div>
            <div class="item-row">
                <label class="text-sm" for="whiteHat">Số lượng Mũ Trắng</label>
                <input type="number" min="0" id="whiteHat" name="whiteHat" class="input-text input-num"
                       th:value="${numWhite != null ? numWhite : 0}">
            </div>
        </div>
        <div class="card-actions">
            <button type="button" id="sendButton" class="btn btn-primary">Khởi tạo ván mới</button>
            <a href="/sp" target="_blank" class="btn btn-secondary">Mở phòng chơi</a>
        </div>
    </div>

    <div class="card qr-sm">
        <p class="card-label">Mã QR để người chơi tham gia</p>
        <div class="qr-container">
            <img th:src="${image}" alt="Mã QR để tham gia phòng Spyfall" class="qr-image">
        </div>
    </div>

    <div class="card">
        <p class="card-label">Loại người chơi khỏi ván</p>
        <div class="grid-2">
            <label th:each="item : ${player}" class="grid-cell grid-cell-choice">
                <input type="radio" name="selectedPlayer" th:value="${item.id}"
                       th:data-username="${item.userName}" th:disabled="${item.remove}">
                <span th:text="${item.id + '. ' + item.userName}"
                      th:classappend="${item.remove} ? 'muted' : ''"></span>
            </label>
        </div>
        <div class="card-actions">
            <button type="button" id="removeButton" class="btn btn-danger">Loại người đã chọn</button>
            <a href="/sp/removeList" class="btn btn-quiet">Xem trang quản lý người chơi</a>
        </div>
    </div>
</div>

<script>
    const CONFIG_KEY = 'spyfall.setup.v1';
    const FIELDS = ['total', 'spy', 'whiteHat'];

    function saveConfig() {
        const state = {};
        FIELDS.forEach(id => state[id] = document.getElementById(id).value);
        sessionStorage.setItem(CONFIG_KEY, JSON.stringify(state));
    }

    function restoreConfig() {
        const raw = sessionStorage.getItem(CONFIG_KEY);
        if (!raw) return;
        try {
            const state = JSON.parse(raw);
            FIELDS.forEach(id => {
                if (state[id] !== undefined) document.getElementById(id).value = state[id];
            });
        } catch (error) {
            console.error('Không khôi phục được cấu hình:', error);
        }
    }

    FIELDS.forEach(id => document.getElementById(id).addEventListener('change', saveConfig));
    restoreConfig();

    document.getElementById('sendButton').onclick = function () {
        saveConfig();
        const path = ['/sp/setup', ...FIELDS.map(id => document.getElementById(id).value)].join('/');
        fetch(path)
            .then(() => {
                UI.flash({message: 'Đã khởi tạo ván mới.', tone: 'success'});
                UI.go('/sp/setup');
            })
            .catch(() => UI.toast('Không khởi tạo được ván. Vui lòng thử lại.', 'danger'));
    };

    document.getElementById('removeButton').addEventListener('click', async function () {
        const selected = document.querySelector('input[name="selectedPlayer"]:checked');
        if (!selected) { UI.toast('Vui lòng chọn một người chơi.'); return; }
        const name = selected.dataset.username;
        const confirmed = await UI.confirm({
            title: 'Loại ' + name + '?',
            message: 'Vai trò của người này sẽ được công khai cho cả phòng.',
            confirmLabel: 'Loại khỏi ván',
            tone: 'danger'
        });
        if (!confirmed) return;

        fetch('/sp/remove/' + selected.value)
            .then(response => response.text())
            .then(role => {
                UI.flash({title: name + ' bị loại', message: 'Vai trò: ' + role});
                UI.reload();
            })
            .catch(() => UI.toast('Không loại được người chơi. Vui lòng thử lại.', 'danger'));
    });
</script>
</body>
</html>
